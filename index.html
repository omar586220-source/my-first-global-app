<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي العالمي الأول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #2f80ed;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #666;
        }
        .badge {
            background-color: #27ae60;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في موقعي العالمي! 🚀</h1>
        <p>هذه الصفحة مكتوبة بلغة HTML ومرفوعة على جيت هب لتكون متاحة لأي شخص في العالم.</p>
        <div class="badge">يعمل بنجاح مية بالمية وعالمي واونلاين ومجاني</div>
    </div>

</body>
</html>
